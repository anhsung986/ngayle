<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không Gian Ngày Lễ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.2) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(192, 132, 252, 0.2) 0%, transparent 40%),
                        linear-gradient(135deg, #070b14 0%, #0d1527 50%, #172554 100%);
            min-height: 100vh; display: flex; justify-content: center;
            align-items: center; color: #ffffff; padding: 20px;
            position: relative; overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            background: rgba(56, 189, 248, 0.15);
            filter: blur(80px);
            top: 10%; left: 10%;
            z-index: 0; pointer-events: none;
        }

        .dashboard {
            background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px); border-radius: 30px;
            border: 1px solid rgba(56, 189, 248, 0.3); padding: 50px 40px;
            width: 100%; max-width: 950px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(56, 189, 248, 0.08);
            position: relative; z-index: 1;
        }
        .header { text-align: center; margin-bottom: 45px; }
        .header h1 { 
            font-size: 3rem; font-weight: 700; margin-bottom: 12px; 
            text-shadow: 0 2px 15px rgba(56,189,248,0.4); 
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        .header p { font-size: 1.1rem; font-weight: 400; color: rgba(224, 242, 254, 0.85); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 24px; }
        
        .card {
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.4) 0%, rgba(15, 23, 42, 0.6) 100%); 
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 24px; padding: 40px 20px; text-align: center; text-decoration: none;
            color: #ffffff; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; flex-direction: column; align-items: center; 
            position: relative; overflow: hidden; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .card:hover {
            transform: translateY(-10px); 
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.25) 0%, rgba(192, 132, 252, 0.25) 100%);
            border-color: rgba(56, 189, 248, 0.8); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(56,189,248,0.5);
        }
        .icon { font-size: 4rem; margin-bottom: 20px; transition: transform 0.4s ease; filter: drop-shadow(0 6px 10px rgba(56,189,248,0.5)); }
        .card:hover .icon { transform: scale(1.2) rotate(5deg); }
        
        .title { 
            font-size: 1.4rem; 
            font-weight: 700; 
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            color: #f0f9ff;
        }
        
        #loading { text-align: center; font-size: 1.2rem; width: 100%; grid-column: 1 / -1; color: rgba(224, 242, 254, 0.8); }
        .error { color: #f87171; text-align: center; width: 100%; grid-column: 1 / -1; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 11, 20, 0.85); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: all 0.4s ease;
        }
        .overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 45px 55px; border-radius: 25px; text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 30px rgba(56,189,248,0.2);
        }
        .spinner {
            border: 4px solid rgba(56,189,248,0.1); border-top: 4px solid #38bdf8;
            border-right: 4px solid #c084fc;
            border-radius: 50%; width: 55px; height: 55px;
            animation: spin 1s linear infinite; margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal p { font-size: 1.3rem; font-weight: 600; letter-spacing: 1px; color: #e0f2fe; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>Trang Chủ Ngày Lễ</h1>
            <p>Tự động cập nhật tài liệu từ thư mục <strong>0</strong>!</p>
        </div>
        <div class="grid" id="file-grid">
            <div id="loading">⏳ Đang quét thư mục 0...</div>
        </div>
    </div>

    <div id="overlay" class="overlay">
        <div class="modal">
            <div class="spinner"></div>
            <p>[ Đang kiểm tra thông tin... ]</p>
        </div>
    </div>

    <script>
        const githubUsername = 'anhsung986';
        const repoName = 'ngayle';
        const folderPath = '0';

        const apiURL = `https://api.github.com/repos/${githubUsername}/${repoName}/contents/${folderPath}`;

        async function fetchGitHubFiles() {
            const grid = document.getElementById('file-grid');
            
            try {
                const response = await fetch(apiURL);
                if (!response.ok) throw new Error('Thư mục "0" chưa tồn tại hoặc rỗng');
                
                const files = await response.json();
                grid.innerHTML = ''; 
                
                if(!Array.isArray(files) || files.length === 0) {
                    grid.innerHTML = '<div style="text-align:center; width:100%; color:rgba(224,242,254,0.7);">Thư mục 0 hiện đang trống.</div>';
                    return;
                }
                
                files.forEach(file => {
                    let icon = '📄'; 
                    const fileNameLower = file.name.toLowerCase();
                    
                    if (file.type === 'dir') icon = '📁';
                    else if(fileNameLower.endsWith('.jpg') || fileNameLower.endsWith('.png') || fileNameLower.endsWith('.gif')) icon = '🖼️';
                    else if(fileNameLower.endsWith('.pdf')) icon = '📕';
                    else if(fileNameLower.endsWith('.xlsx') || fileNameLower.endsWith('.csv')) icon = '📊';
                    else if(fileNameLower.endsWith('.mp4')) icon = '🎬';
                    else if(fileNameLower.endsWith('.html')) icon = '🌐';
                    
                    const displayName = file.name.replace(/\.[^/.]+$/, "").toUpperCase();
                    
                    const card = `
                        <a onclick="handleFileClick('${file.name}')" class="card">
                            <span class="icon">${icon}</span>
                            <span class="title">${displayName}</span>
                        </a>
                    `;
                    grid.innerHTML += card;
                });
            } catch (error) {
                grid.innerHTML = `<div class="error">Lỗi: ${error.message}.</div>`;
            }
        }

        function handleFileClick(fileName) {
            const overlay = document.getElementById('overlay');
            
            const cleanName = fileName.replace(/\.[^/.]+$/, "");
            const targetUrl = `https://wow.ngay-le.site.je/0/${cleanName}`;
            
            overlay.classList.add('active');
            
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 1500); 
        }

        fetchGitHubFiles();
    </script>
</body>
</html>
